
networks:
  oura-network:
    driver: bridge

services:
  # Kafka broker with KRaft mode (no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    platform: linux/amd64
    container_name: oura-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - oura-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Topic creator
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    platform: linux/amd64
    container_name: oura-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - oura-network
    command: >
      bash -c "
        kafka-topics --create --if-not-exists --topic ada_pay_txs --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 &&
        echo 'Topic ada_pay_txs created successfully'
      "

  # Oura service
  oura:
    image: registry.2lovelaces.io/lidonation/lidonation/oura
    container_name: oura-daemon
    volumes:
      - ./daemon.toml:/etc/oura/daemon.toml:ro
    networks:
      - oura-network
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    command: ["daemon", "--config", "/etc/oura/daemon.toml"]
    restart: unless-stopped

  # Webhook consumer service
  webhook-consumer:
    image: confluentinc/cp-kafka:7.4.0
    platform: linux/amd64
    container_name: oura-webhook-consumer
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    networks:
      - oura-network
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:-http://host.docker.internal:3000/webhook}
    command: >
      bash -c "
        echo 'Starting webhook consumer...' &&
        kafka-console-consumer --bootstrap-server kafka:29092 --topic ada_pay_txs --from-beginning |
        while IFS= read -r message; do
          echo 'Sending to webhook: ' $$message &&
          curl -X POST \"$$WEBHOOK_URL\" \
            -H 'Content-Type: application/json' \
            -d \"$$message\" || echo 'Webhook failed'
        done
      "
    restart: unless-stopped

  # Optional: Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oura-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: oura-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - oura-network
